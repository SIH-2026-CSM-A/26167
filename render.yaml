services:
  - type: web
    name: satquery-ai
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PORT
        value: 8000
      - key: COST_CEILING
        value: "10.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
