[project]
name = "satquery-ai-backend"
version = "0.1.0"
description = "SatQuery AI (SIH26167) — agentic vision-language backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.5",
    "rasterio>=1.4",
    "numpy>=2.1",
    "pillow>=11.0",
    "huggingface-hub==0.36.2",
    "scikit-image>=0.26.0",
    "s2cloudless>=1.7.3",
    "reportlab>=5.0.1",
    "asyncpg>=0.31.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "authlib>=1.3",
    "httpx>=0.27",
    "gradio-client==1.14.0",
]

[project.optional-dependencies]
# Local model execution: training, evaluation, benchmarks and the model tests. The deployed
# API does not install this (Dockerfile: uv sync --no-dev); VQA and change detection run in
# the inference Space (inference_space/). Install with: uv sync --extra inference
inference = [
    "torch>=2.4",
    "torchvision>=0.29.0",
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "safetensors>=0.8.0",
    "accelerate==0.34.2",
    "bitsandbytes>=0.44",
    "peft>=0.13",
    "timm==1.0.29",
    "einops==0.8.2",
    "sentencepiece==0.2.2",
    "datasets>=5.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bit_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Leaf modules never import each other"
type = "independence"
modules = [
    "app.models",
    "app.training",
    "app.tools.vqa_grounding",
    "app.tools.change_detection",
    "app.tools.fusion",
    "app.router",
    "app.verification",
    "app.evidence",
    "app.ingestion",
    "app.db",
    "app.auth",
    "app.history",
    "app.inference",
]

[[tool.importlinter.contracts]]
name = "Only pipeline composes modules"
type = "layers"
layers = [
    "app.api",
    "app.pipeline",
    "app.router | app.verification | app.evidence | app.ingestion | app.models | app.training | app.tools.vqa_grounding | app.tools.change_detection | app.tools.fusion | app.db | app.auth | app.history | app.inference",
    "app.core",
    "app.contracts",
]

[[tool.importlinter.contracts]]
name = "API and pipeline never load local models or torch"
type = "forbidden"
source_modules = ["app.api", "app.pipeline"]
forbidden_modules = [
    "app.models",
    "app.tools.change_detection.bit_model",
    "torch",
    "torchvision",
    "transformers",
    "peft",
    "timm",
]

[[tool.importlinter.contracts]]
name = "Contracts import nothing of ours"
type = "forbidden"
source_modules = ["app.contracts"]
forbidden_modules = [
    "app.core", "app.pipeline", "app.api", "app.models", "app.training",
    "app.tools", "app.router", "app.verification", "app.evidence", "app.ingestion",
    "app.db", "app.auth", "app.history", "app.inference",
]
